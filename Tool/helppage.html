<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Help & Support</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: black;
        color: #32ffd3;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .wrapper {
        width: 500px;
        text-align: center;
    }

    .title-box {
        background: #32ffd3;
        color: black;
        padding: 14px;
        border-radius: 10px;
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 25px;
        box-shadow: 0 0 18px #32ffd3;
    }

    .block {
        background: #0d0d0d;
        padding: 35px;
        border-radius: 14px;
        border: 3px solid #32ffd3;
        box-shadow: 0 0 18px #32ffd3;
    }

    .option {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 14px;
        margin-top: 15px;
        border: 2px solid #32ffd3;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 12px #32ffd3;
        transition: 0.3s;
    }

    .option:hover {
        background: #32ffd3;
        color: black;
    }

    .option:hover svg {
        stroke: black;
    }

    .option svg {
        width: 28px;
        height: 28px;
        stroke: #32ffd3;
        fill: none;
        stroke-width: 2;
        flex-shrink: 0;
    }

    .option span {
        font-size: 18px;
        font-weight: bold;
    }

    .back-btn {
        width: 100%;
        margin-top: 30px;
        padding: 14px;
        font-size: 18px;
        font-weight: bold;
        background: transparent;
        color: #32ffd3;
        border: 3px solid #32ffd3;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 18px #32ffd3;
        transition: 0.3s;
    }

    .back-btn:hover {
        background: #32ffd3;
        color: black;
        box-shadow: 0 0 25px #32ffd3, 0 0 45px #32ffd3;
    }
</style>
</head>

<body>

<div class="wrapper">

    <div class="title-box">Help & Support</div>

    <div class="block">

        <!-- Customer / Chat Support -->
        <div class="option">
            <svg viewBox="0 0 24 24">
                <path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
            </svg>
            <span>Customer / Chat Support</span>
        </div>

        <!-- Guides / Tutorials -->
        <div class="option">
            <svg viewBox="0 0 24 24">
                <path d="M4 3h12a3 3 0 0 1 3 3v15H7a3 3 0 0 0-3 3z"/>
                <path d="M7 3v18"/>
            </svg>
            <span>Guides & Tutorials</span>
        </div>

        <!-- Community Forums -->
        <div class="option">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="7" y1="8" x2="17" y2="8"/>
                <line x1="7" y1="12" x2="17" y2="12"/>
                <line x1="7" y1="16" x2="13" y2="16"/>
            </svg>
            <span>Community Forums</span>
        </div>

        <!-- Email Support -->
        <div class="option">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <polyline points="3,7 12,13 21,7"/>
            </svg>
            <span>Email Support</span>
        </div>

        <!-- Feedback -->
        <div class="option">
            <svg viewBox="0 0 24 24">
                <path d="M21 15a4 4 0 0 1-4 4H7l-4 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
                <line x1="9" y1="10" x2="15" y2="10"/>
                <line x1="9" y1="14" x2="13" y2="14"/>
            </svg>
            <span>Provide Feedback</span>
        </div>

        <!-- FAQs (last) -->
        <div class="option">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/>
                <path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.9.3-1.5 1-1.5 1.7"/>
                <line x1="12" y1="17" x2="12" y2="17"/>
            </svg>
            <span>FAQs</span>
        </div>

        <!-- Back to Login -->
        <button class="back-btn" onclick="location.href='page0.html'">
            ← Back to Login
        </button>

    </div>
</div>

</body>
</html>
