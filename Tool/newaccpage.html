<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create New Account</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: black;
        color: #32ffd3;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        animation: breathe 6s ease-in-out infinite;
    }

    @keyframes breathe {
        0%   { box-shadow: inset 0 0 60px #001f1a; }
        50%  { box-shadow: inset 0 0 120px #004d40; }
        100% { box-shadow: inset 0 0 60px #001f1a; }
    }

    .block {
        background: #0d0d0d;
        padding: 40px;
        width: 440px;
        border-radius: 14px;
        border: 3px solid #32ffd3;
        box-shadow: 0 0 18px #32ffd3;
        text-align: center;
        z-index: 2;
    }

    h2 {
        margin-bottom: 10px;
        text-shadow: 0 0 12px #32ffd3;
    }

    .enter-text {
        margin-bottom: 20px;
        font-size: 18px;
        text-shadow: 0 0 10px #32ffd3;
    }

    input, select, .btn {
        width: 100%;
        padding: 15px;
        margin-top: 12px;
        font-size: 17px;
        background: black;
        color: #32ffd3;
        border: 3px solid #32ffd3;
        border-radius: 8px;
        box-shadow: 0 0 14px #32ffd3;
        box-sizing: border-box;
    }

    input:focus, select:focus {
        outline: none;
        box-shadow: 0 0 22px #32ffd3;
    }

    .mobile-wrap {
        display: flex;
        gap: 10px;
    }

    .mobile-wrap input:first-child {
        width: 30%;
        text-align: center;
    }

    .mobile-wrap input:last-child {
        width: 70%;
    }

    .terms {
        margin-top: 15px;
        text-align: left;
        font-size: 14px;
    }

    .terms input {
        width: auto;
        margin-right: 8px;
    }

    .btn {
        margin-top: 20px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn:hover {
        background: #32ffd3;
        color: black;
    }

    .success {
        margin-top: 20px;
        font-size: 18px;
        display: none;
        color: #32ffd3;
        text-shadow: 0 0 10px #32ffd3;
    }

    .success a {
        color: #32ffd3;
        text-decoration: underline;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="block">
    <h2>Create New Account</h2>
    <div class="enter-text">Enter your Details</div>

    <input id="fname" type="text" placeholder="First Name">
    <input id="lname" type="text" placeholder="Last Name">
    <input id="email" type="email" placeholder="Email">

    <!-- Nation with search -->
    <input list="nations" id="nation" placeholder="Select / Search Nation" onchange="updateCode()">
    <datalist id="nations">
        <option value="India">
        <option value="United States">
        <option value="United Kingdom">
        <option value="Canada">
        <option value="Australia">
        <option value="Germany">
        <option value="France">
        <option value="Japan">
        <option value="China">
        <option value="Brazil">
        <option value="South Africa">
    </datalist>

    <!-- Mobile -->
    <div class="mobile-wrap">
        <input id="code" type="text" value="+91" readonly>
        <input id="mobile" type="number" placeholder="Mobile Number">
    </div>

    <div class="terms">
        <label>
            <input type="checkbox" id="terms">
            I agree to the Terms of Service
        </label>
    </div>

    <button class="btn" onclick="createAccount()">Create Account</button>

    <div id="success" class="success">
        ✅ New Account Created Successfully<br><br>
        <span>Please go to <a onclick="goLogin()">Login page</a></span>
    </div>
</div>

<script>
const codes = {
    "India": "+91",
    "United States": "+1",
    "United Kingdom": "+44",
    "Canada": "+1",
    "Australia": "+61",
    "Germany": "+49",
    "France": "+33",
    "Japan": "+81",
    "China": "+86",
    "Brazil": "+55",
    "South Africa": "+27"
};

function updateCode() {
    const nation = document.getElementById("nation").value;
    if (codes[nation]) {
        document.getElementById("code").value = codes[nation];
    }
}

function createAccount() {
    const f = fname.value.trim();
    const l = lname.value.trim();
    const e = email.value.trim();
    const n = nation.value.trim();
    const m = mobile.value.trim();
    const t = terms.checked;

    if (!f || !l || !e || !n || !m) {
        alert("Please fill all fields");
        return;
    }
    if (!t) {
        alert("Please agree to the Terms of Service");
        return;
    }

    document.getElementById("success").style.display = "block";
}

function goLogin() {
    window.location.href = "page0.html";
}
</script>

</body>
</html>
