<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Essential Performance Tool</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: black;
    color: #32ffd3;
    height: 100vh;
    overflow: hidden;
}

.header {
    position: absolute;
    top: 30px;
    width: 100%;
    text-align: center;
    z-index: 2;
}

.title-box {
    display: inline-block;
    background: #32ffd3;
    color: black;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 26px;
    font-weight: bold;
    box-shadow: 0 0 15px #32ffd3;
}

.help-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    background: transparent;
    color: #32ffd3;
    border: 2px solid #32ffd3;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 0 10px #32ffd3;
    z-index: 2;
    transition: 0.3s;
}

.help-btn:hover,
.help-btn:active {
    background: #32ffd3;
    color: black;
    box-shadow: 0 0 25px #32ffd3, 0 0 45px #32ffd3;
    transform: scale(1.05);
}

.wrapper {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.block {
    background: #0d0d0d;
    padding: 40px;
    width: 420px;
    border-radius: 14px;
    border: 3px solid #32ffd3;
    box-shadow: 0 0 18px #32ffd3;
    text-align: center;
}

h2 {
    margin-bottom: 25px;
    text-shadow: 0 0 12px #32ffd3;
}

input, .btn {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    font-size: 18px;
    background: black;
    color: #32ffd3;
    border: 3px solid #32ffd3;
    border-radius: 8px;
    box-shadow: 0 0 14px #32ffd3;
    box-sizing: border-box;
}

input:focus {
    outline: none;
    box-shadow: 0 0 22px #32ffd3;
}

.btn {
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #32ffd3;
    color: black;
}

.footer {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="header">
    <div class="title-box">Essential Performance Tool (EPT)</div>
</div>

<!-- FIXED Help Button -->
<button class="help-btn" onclick="window.location.href='helppage.html'">Help</button>

<div class="wrapper">
    <div class="block">
        <h2>Login</h2>

        <input id="user" type="text" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">

        <button class="btn" onclick="login()">Login</button>
        <button class="btn" onclick="location.href='newaccpage.html'">Create New Account</button>
    </div>
</div>

<div class="footer">
    © 2025 Duurvextech Company All Rights Reserved
</div>

<script>
function login() {
    let u = user.value;
    let p = pass.value;
    if(u === "" || p === "") {
        alert("Please enter username and password");
        return;
    }
    window.location.href = "page1.html";
}
</script>

</body>
</html>
